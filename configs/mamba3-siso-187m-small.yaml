# Mamba-3 SISO 187M, one epoch over a small dataset: the first 50M tokens of the FineWeb-Edu
# training shard. Same model, data source and optimizer as the earlier full SISO run
# (runs/mamba3-siso-187m-20261103-112002), except the warmup.
# Sources: [M3] Mamba-3 paper (arXiv 2603.15569), [M2] Mamba-2 paper (arXiv 2405.21060) App. D.2,
# which [M3] App. D says its pretraining follows, [CK] weights/mamba3-siso-187m/config.json.
# "NOT IN PAPER" marks a choice the papers leave open.
# data-small/train-50m.bin = the first 50,000,000 tokens of data/tokens/000_00000.bin, made with
#   np.memmap("data/tokens/000_00000.bin", dtype=np.uint32, mode="r")[:50_000_000].tofile(...)
# (50M - 1) tokens / 2048 per sample = 24,414 samples; / 256 per step = 95 steps.

run_name: mamba3-siso-187m-small
seed: 0                        # NOT IN PAPER

data:
  train_bin: data-small/train-50m.bin    # uint32 token ids, Llama-3.1 tokenizer [M3 sec. 4.1]
  val_bin: data/tokens/013_00000.bin
  seq_len: 2048                # [M3 sec. 4.1]
  val_samples: 64              # NOT IN PAPER: the first 64 samples of val_bin
  num_workers: 1               # DataLoader workers; FlashAttention uses 1 (the data is a memory map)

model:                         # [CK]; MambaConfig fields
  d_model: 768
  d_intermediate: 1536         # gated MLP in every block (paper lists 1500 for 180M; checkpoint uses 1536)
  n_layer: 12
  vocab_size: 128256           # Llama-3.1 tokenizer
  ssm_cfg:
    layer: Mamba3
    d_state: 128               # [M3 App. D]
    expand: 2                  # [M3 App. D]
    headdim: 64                # [M3 App. D]
    ngroups: 1
    rope_fraction: 0.5
    dt_min: 0.001
    dt_max: 0.1
    dt_init_floor: 0.0001
    A_floor: 0.0001
    chunk_size: 64             # recommended for SISO in mamba3.py
    is_mimo: false             # SISO
    is_outproj_norm: false
  rms_norm: true
  residual_in_fp32: true
  fused_add_norm: true
  pad_vocab_size_multiple: 16
  tie_embeddings: true

optim:
  peak_lr: 1.5e-3              # NOT IN PAPER: same as the full SISO run (3e-3 spiked there)
  min_lr: 1.0e-5               # cosine decay target [M2 D.2]
  betas: [0.9, 0.95]           # [M2 D.2]
  weight_decay: 0.1            # [M2 D.2]; applied to 2-D weight matrices only (NOT IN PAPER)
  grad_clip: 1.0               # [M2 D.2]
  warmup_fraction: 0.1         # NOT IN PAPER: 10 of 95 steps. The full run used 0.01, which would
                               # be 1 step here: too short a warmup at this peak_lr.

train:
  batch_size: 256              # sequences per step; 256 x 2048 = 524,288 tokens = 0.5M [M2 D.2]
  micro_batch_size: 2          # NOT IN PAPER: memory only (4 ran out of memory on the 32 GB RTX 5090)
  max_steps: null              # null = one full pass over train_bin (95 steps)
  log_every: 5
  val_every: 25
  save_every: 50
  dtype: bfloat16              # autocast; parameters stay float32 [M3 App. D: bf16]
