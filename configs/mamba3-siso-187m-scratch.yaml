# Mamba-3 SISO 187M trained from scratch: one epoch over the 731M-token FineWeb-Edu shard,
# on 3 x A100 40 GB with DDP. Sources: [M3] Mamba-3 paper (arXiv 2603.15569), [M2] Mamba-2 paper
# (arXiv 2405.21060) App. D.2, [CK] weights/mamba3-siso-187m/config.json. "NOT IN PAPER" marks a
# choice the papers leave open.
# Run on one GPU with
#   .venv/bin/python train.py --config configs/mamba3-siso-187m-scratch.yaml --run-dir runs/mamba3-siso-187m-scratch

run_name: mamba3-siso-187m-scratch
seed: 0                        # NOT IN PAPER

data:
  train_bin: data/tokens/000_00000.bin   # uint32 token ids, Llama-3.1 tokenizer [M3 sec. 4.1]
  val_bin: data/tokens/013_00000.bin
  seq_len: 2048                # [M3 sec. 4.1]
  val_samples: 64              # NOT IN PAPER: the first 64 samples of val_bin
  num_workers: 1               # DataLoader workers; FlashAttention uses 1 (the data is a memory map)

model:                         # [CK]; MambaConfig fields
  d_model: 768
  d_intermediate: 1536
  n_layer: 12
  vocab_size: 128256           # Llama-3.1 tokenizer
  ssm_cfg:
    layer: Mamba3
    d_state: 128               # [M3 App. D]
    expand: 2                  # [M3 App. D]
    headdim: 64                # [M3 App. D]
    ngroups: 1
    rope_fraction: 0.5
    dt_min: 0.001
    dt_max: 0.1
    dt_init_floor: 0.0001
    A_floor: 0.0001
    chunk_size: 64
    is_mimo: false
    is_outproj_norm: false
  rms_norm: true
  residual_in_fp32: true
  fused_add_norm: true
  pad_vocab_size_multiple: 16
  tie_embeddings: true

optim:
  peak_lr: 1.5e-3              # NOT IN PAPER: same as the earlier full SISO run (3e-3 spiked)
  min_lr: 1.0e-5               # cosine decay target [M2 D.2]
  betas: [0.9, 0.95]           # [M2 D.2]
  weight_decay: 0.1            # [M2 D.2]; 2-D weight matrices only (NOT IN PAPER)
  grad_clip: 1.0               # [M2 D.2]
  warmup_fraction: 0.01        # NOT IN PAPER: 14 steps, as in the earlier full SISO run

train:
  epochs: 1
  batch_size: 258              # 3 GPUs x micro 2 x 43 accumulation steps; 258 x 2048 = 528K tokens
                               # [M2 D.2: 0.5M]. Must be a multiple of micro_batch_size x GPUs.
  micro_batch_size: 2          # NOT IN PAPER: memory only (4 ran out of memory on a 32 GB GPU)
  max_steps: null              # null = one full pass: 357,361 samples / 258 = 1385 steps
  log_every: 10
  val_every: 100
  save_every: 100              # last.pt for resuming after a job time limit
  dtype: bfloat16              # autocast; parameters stay float32 [M3 App. D: bf16]
