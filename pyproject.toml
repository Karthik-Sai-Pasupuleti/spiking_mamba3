[project]
name = "spiking-mamba3"
version = "0.1.0"
description = "Mamba-3 from state-spaces/mamba, with a language model and training code"
readme = "README.md"
requires-python = ">=3.12"
# torch, triton, einops: the upstream Mamba-3 SISO files in src/models/ and src/utils/ (see README)
# (from state-spaces/mamba@e9594ce), with upstream's version bounds. Triton runs all SISO kernels.
# The TileLang (MIMO) and CuTe (Mamba3.step) kernels are copied too, but they need the optional
# extra `mimo` below; without it Mamba3 still runs SISO. packaging is imported by src/utils/determinism.py (fused norm).
# numpy, pyyaml and tokenizers are for our code: numpy memory-maps the token files, pyyaml
# reads configs/, tokenizers reads the Llama-3.1 tokenizer.json for data and text generation,
# pyarrow reads the WikiText-103 parquet files in src/prepare_wikitext103.py.
# spikingjelly provides the PLIF neuron (ParametricLIFNode) of src/spiking_mamba3.py.
# tqdm draws the per-epoch progress bar of src/train.py (spikingjelly needs it too).
# mlflow tracks every training run (src/utils/tracking.py): config, git commit, metrics, logs.
dependencies = [
    "torch",
    "triton>=3.5.0",
    "einops",
    "packaging",
    "numpy",
    "pyyaml",
    "tokenizers",
    "pyarrow",
    "spikingjelly",
    "tqdm",
    "mlops>=0.1.0",
    "mlflow>=3.18.0",
]

[project.optional-dependencies]
# ipykernel runs notebooks/ on this venv, nbconvert executes them from the command line,
# matplotlib draws their plots.
dev = ["pytest", "ipykernel", "nbconvert", "matplotlib"]
# Upstream's pins for the TileLang MIMO kernels and the CuTe step kernel (Mamba3.step).
mimo = ["tilelang==0.1.8", "apache-tvm-ffi<=0.1.12", "quack-kernels>=0.3.4"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Exact kernel-stack versions: the torch and triton that run Mamba-3 on this machine (RTX 5090).
constraint-dependencies = [
    "torch==2.14.1",
    "triton==3.8.0",
]

# The RTX 5090 (compute capability 12.0) needs a torch build for CUDA 12.8 or newer.
[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/configs", "src/dataset", "src/models", "src/utils"]

# Upstream copies (only their imports changed): never reformat them.
[tool.ruff]
extend-exclude = [
    "src/models/kernels/triton",
    "src/models/layers/mamba3.py",
    "src/models/layers/block.py",
    "src/models/layers/mlp.py",
    "src/utils/determinism.py",
    "src/utils/torch.py",
]

[tool.black]
force-exclude = "^/src/(models/kernels/triton/|models/layers/(mamba3|block|mlp)\\.py|utils/(determinism|torch)\\.py)"

[tool.pytest.ini_options]
# src/ on sys.path for `dataset`, `models`, ...; the repo root for `scripts.prepare_fineweb`.
pythonpath = ["src", "."]
testpaths = ["tests"]
